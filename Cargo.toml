[package]
name = "rolling-logger"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Production-grade rolling file logger with daily/size rotation, async gzip archival, configurable timezone and fsync durability"
license = "MIT"
keywords = ["logging", "rolling", "rotation", "gzip", "tracing", "file-logger"]
categories = ["development-tools::debugging"]
repository = "https://github.com/ewoowe/rolling-logger"
readme = "README.md"

[lib]
name = "rolling_logger"
path = "src/lib.rs"

[features]
default = ["tracing"]
# tracing 门面集成（init_logger / LoggerGuards）
tracing = ["dep:tracing-subscriber", "dep:tracing-appender"]
# log 门面集成（init_log_logger）
log-backend = ["dep:log"]
# slog 门面集成（init_slog_logger）
slog-backend = ["dep:slog"]

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
flate2 = "1"
tracing = "0.1"
anyhow = "1"
# 可选：tracing 门面集成
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-appender = { version = "0.2", optional = true }
# 可选：log 门面集成
log = { version = "0.4", optional = true, features = ["std"] }
# 可选：slog 门面集成
slog = { version = "2", optional = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "tracing"
required-features = ["tracing"]

[[example]]
name = "log"
required-features = ["log-backend"]

[[example]]
name = "slog"
required-features = ["slog-backend"]
